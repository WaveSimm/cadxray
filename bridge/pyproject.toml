[project]
name = "cadxray"
version = "0.12.0"
description = "Your AI actually looks inside FreeCAD - diagnose red sketches, rebuild vendor STEP/STL parametrically, inspect, draw, print-check and run FEM. MCP server with 36 tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "WaveSimm" }]
keywords = ["mcp", "model-context-protocol", "freecad", "cad", "parametric", "step", "stl", "fem", "3d-printing", "claude"]
dependencies = ["mcp>=1.2"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/WaveSimm/cadxray"
Documentation = "https://wavesimm.github.io/cadxray/en/"
Repository = "https://github.com/WaveSimm/cadxray"
Issues = "https://github.com/WaveSimm/cadxray/issues"

[project.scripts]
cadxray = "cadxray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadxray"]

# 애드온(저장소 freecad/cadxray + package.xml + LICENSE)을 패키지 안에 동봉한다 → `cadxray install` 이 복사한다.
# 경로가 빌드 위치에 따라 달라져(저장소 = ../, sdist = ./) 훅에서 정한다. hatch_build.py 참고.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/cadxray", "README.md", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../freecad" = "freecad"
"../package.xml" = "package.xml"
"../LICENSE" = "LICENSE"
