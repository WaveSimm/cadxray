[project]
name = "freecad-diag-mcp"
version = "0.2.0"
description = "FreeCAD 모델 진단용 MCP 서버 (브릿지 + 동봉 애드온)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
freecad-diag-mcp = "freecad_diag_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_diag_mcp"]

# 애드온(저장소 addon/FreeCADDiag)을 패키지 안에 동봉한다 → `freecad-diag-mcp install` 이 복사한다.
[tool.hatch.build.targets.wheel.force-include]
"../addon/FreeCADDiag" = "freecad_diag_mcp/addon/FreeCADDiag"

[tool.hatch.build.targets.sdist]
include = ["src/freecad_diag_mcp", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"../addon/FreeCADDiag" = "addon/FreeCADDiag"
