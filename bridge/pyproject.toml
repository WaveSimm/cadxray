[project]
name = "cadxray"
version = "0.12.0"
description = "FreeCAD 모델 진단·수정용 MCP 서버 — Claude Code·Cursor·VS Code·Codex·Gemini CLI 등 MCP 클라이언트 공용 (브릿지 + 동봉 애드온)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
cadxray = "cadxray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadxray"]

# 애드온(저장소 freecad/cadxray + package.xml + LICENSE)을 패키지 안에 동봉한다 → `cadxray install` 이 복사한다.
[tool.hatch.build.targets.wheel.force-include]
"../freecad" = "cadxray/addon/freecad"
"../package.xml" = "cadxray/addon/package.xml"
"../LICENSE" = "cadxray/addon/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["src/cadxray", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"../freecad" = "freecad"
"../package.xml" = "package.xml"
"../LICENSE" = "LICENSE"
